name: Browser E2E
on:
  push:
    paths: ['vps/fanout/frontend/**', 'vps/fanout/*.go', 'vps/fanout/go.sum', '.github/workflows/e2e.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache-dependency-path: vps/fanout/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vps/fanout/frontend/package-lock.json
      - name: Build the console
        working-directory: vps/fanout/frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build the manager
        working-directory: vps/fanout
        run: go build -o /tmp/vgatebox-fanout-e2e .
      - name: Provide the pinned Xray binary
        run: |
          python scripts/install_xray.py --output /tmp/e2e-xray
          sudo mkdir -p /tmp/vgb-e2e/bin
          sudo cp /tmp/e2e-xray/xray /tmp/vgb-e2e/bin/xray
      # 真后端、零隧道：目标数量全程只到 1 且无候选（CI 不写候选池），
      # 不建 OpenVPN、不连 VPN Gate；直出开关走内置 Xray，需上一步的二进制。
      - name: Start the manager under test
        run: |
          sudo /tmp/vgatebox-fanout-e2e -dir /tmp/vgb-e2e -web 18080 -max 4 > /tmp/e2e-manager.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18080/healthz; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:18080/healthz
          {
            echo "E2E_BASE_PATH=/$(sudo cat /tmp/vgb-e2e/basepath | tr -d ' \n\r')"
            echo "E2E_PASSWORD=$(sudo cat /tmp/vgb-e2e/password | tr -d ' \n\r')"
          } >> "$GITHUB_ENV"
      - name: Install Playwright browsers
        run: |
          sudo npx playwright install-deps chromium
          npx playwright install chromium
        working-directory: vps/fanout/frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
      - name: Run Playwright tests
        working-directory: vps/fanout/frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
      - name: Stop the manager under test
        if: always()
        run: |
          sudo pkill -f vgatebox-fanout-e2e || true
          tail -n 100 /tmp/e2e-manager.log || true
