name: Lint and supply chain
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-vet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: vps/fanout/go.sum
      - name: go vet
        working-directory: vps/fanout
        run: go vet ./...

  staticcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: vps/fanout/go.sum
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      # 默认检查集减去 3 个基线豁免（存量见 docs/BASELINE.md，修它们要动业务代码，延后）：
      # -ST1005 error 首字母大写 21 处：中文文案风格，延后统改；
      # -ST1013 数字状态码 1 处：延后；
      # -SA2001 空临界区 1 处 (console_lifecycle.go:23)：疑似用互斥做屏障，需人工复核，并发改动延后。
      - name: staticcheck
        working-directory: vps/fanout
        run: staticcheck -checks '-ST1005,-ST1013,-SA2001' ./...

  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: vps/fanout/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # 第三方依赖门禁：stdlib findings 属工具链债务，只统计；
      # 凡涉及第三方模块的新 findings 一律红灯（无 allowlist，有即修）。
      # 门禁逻辑见 scripts/govulncheck_gate.py（与 CI 调用的同一份代码，本地可复跑验证）。
      - name: govulncheck third-party gate
        working-directory: vps/fanout
        run: |
          govulncheck -json ./... > /tmp/govuln.json || true
          python3 ../../scripts/govulncheck_gate.py /tmp/govuln.json

  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vps/fanout/frontend/package-lock.json
      # 只审生产依赖：dev 依赖的 moderate（vitest 链、@vue/test-utils 链）修要 breaking 升级，延后；
      # 生产依赖当前 0 漏洞，moderate 及以上红灯。
      - name: npm audit (production)
        working-directory: vps/fanout/frontend
        run: npm audit --omit=dev --audit-level=moderate
